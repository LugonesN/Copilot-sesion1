services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=supersecretkey-change-in-production
      - ACCESS_TOKEN_EXPIRE_SECONDS=300
      - REFRESH_TOKEN_EXPIRE_SECONDS=3600
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=admin123
    restart: unless-stopped
